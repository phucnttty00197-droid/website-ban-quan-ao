<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Thanh toán</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap"
          rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/layout.css}">
    <link rel="stylesheet" th:href="@{/css/components.css}">
    <link rel="stylesheet" th:href="@{/css/pages.css}">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
</head>
<body>
<div th:replace="layout/layout :: header"></div>

<main class="container" style="padding: 16px;">
    <h3 class="page-title">Thanh toán</h3>

    <div th:if="${message}" class="status-message status-error" th:text="${message}">
        Thông báo
    </div>

    <div class="card">
        <table>
            <thead>
            <tr>
                <th>Sản phẩm</th>
                <th>Giá</th>
                <th>Số lượng</th>
                <th>Size</th>
            </tr>
            </thead>
            <tbody>
            <tr th:each="item : ${items}">
                <td th:text="${item.name}">Tên sản phẩm</td>
                <td th:text="${#numbers.formatDecimal(item.price, 0, 'POINT', 0, 'COMMA')} + ' VNĐ'">0</td>
                <td th:text="${item.quantity}">1</td>
                <td th:text="${item.sizeName}">M</td>
            </tr>
            </tbody>
        </table>
    </div>

    <div class="cart-summary">
        <div>Tổng tiền: <strong th:text="${#numbers.formatDecimal(totalPrice, 0, 'POINT', 0, 'COMMA')} + ' VNĐ'">0</strong></div>
    </div>

    <form th:action="@{/order/checkout}" method="post" class="card" style="margin-top: 16px;" id="checkoutForm">
        <input type="hidden" name="address" id="shipping_address">
        <input type="hidden" name="lat" id="shipping_lat">
        <input type="hidden" name="lng" id="shipping_lng">
        <div class="form-group">
            <label>Tỉnh / Thành phố</label>
            <select id="provinceSelect" required>
                <option value="">Chọn tỉnh/thành phố</option>
            </select>
        </div>
        <div class="form-group">
            <label>Phường / Xã</label>
            <select id="wardSelect" required>
                <option value="">Chọn phường/xã</option>
            </select>
        </div>
        <div style="height: 320px; border-radius: 12px; overflow: hidden; border: 1px solid #e6e6e6;" id="checkoutMap"></div>
        <div class="form-group" style="margin-top: 12px;">
            <label>Hình thức thanh toán</label>
            <div style="display: flex; flex-direction: column; gap: 8px; margin-top: 8px;">
                <label style="display: flex; align-items: center; gap: 8px; font-weight: 500;">
                    <input type="radio" name="paymentMethod" value="BANK" required style="width: auto; margin: 0;">
                    Chuyển khoản ngân hàng
                </label>
                <label style="display: flex; align-items: center; gap: 8px; font-weight: 500;">
                    <input type="radio" name="paymentMethod" value="COD" checked required style="width: auto; margin: 0;">
                    Thanh toán bằng tiền mặt khi nhận hàng (COD)
                </label>
            </div>
        </div>
        <button class="btn" type="submit">Đặt hàng ngay</button>
    </form>
</main>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
    document.addEventListener('DOMContentLoaded', () => {
        const form = document.getElementById('checkoutForm');
        const provinceSelect = document.getElementById('provinceSelect');
        const wardSelect = document.getElementById('wardSelect');
        const shippingAddress = document.getElementById('shipping_address');
        const shippingLat = document.getElementById('shipping_lat');
        const shippingLng = document.getElementById('shipping_lng');
        const mapEl = document.getElementById('checkoutMap');

        const addressData = {
            'Hải Dương': [
                // TP Hải Dương
                'Phường Trần Phú',
                'Phường Ngọc Châu',
                'Phường Lê Thanh Nghị',
                'Phường Quang Trung',
                'Phường Hải Tân',
                'Phường Tân Bình',
                'Phường Bình Hàn',
                'Phường Thanh Bình',
                'Phường Nhị Châu',
                'Phường Việt Hòa',

                // Chí Linh
                'Phường Sao Đỏ',
                'Phường Văn An',
                'Phường Chí Minh',
                'Phường Cổ Thành',
                'Phường Thái Học',
                'Xã Hoàng Tiến',
                'Xã Hoàng Hoa Thám',
                'Xã An Lạc',
                'Xã Lê Lợi',

                // Kinh Môn
                'Phường An Lưu',
                'Phường Hiến Thành',
                'Phường Phạm Thái',
                'Xã Thái Sơn',
                'Xã Minh Hòa',
                'Xã Duy Tân',
                'Xã Bạch Đằng',

                // Nam Sách
                'Thị trấn Nam Sách',
                'Xã An Bình',
                'Xã An Lâm',
                'Xã Hồng Phong',
                'Xã Quốc Tuấn',
                'Xã Nam Tân',
                'Xã Thanh Quang',

                // Kim Thành
                'Thị trấn Phú Thái',
                'Xã Kim Anh',
                'Xã Kim Liên',
                'Xã Kim Tân',
                'Xã Kim Xuyên',
                'Xã Tuấn Việt',

                // Thanh Hà
                'Thị trấn Thanh Hà',
                'Xã Thanh Xá',
                'Xã Thanh Lang',
                'Xã Cẩm Chế',
                'Xã Hồng Lạc',
                'Xã Liên Mạc',

                // Cẩm Giàng
                'Thị trấn Cẩm Giàng',
                'Xã Cẩm Điền',
                'Xã Cẩm Đông',
                'Xã Cẩm Phúc',
                'Xã Cẩm Vũ',
                'Xã Định Sơn',

                // Bình Giang
                'Thị trấn Kẻ Sặt',
                'Xã Vĩnh Hưng',
                'Xã Hùng Thắng',
                'Xã Long Xuyên',
                'Xã Thái Học',
                'Xã Bình Xuyên',

                // Gia Lộc
                'Thị trấn Gia Lộc',
                'Xã Gia Xuyên',
                'Xã Liên Hồng',
                'Xã Tân Tiến',
                'Xã Hoàng Diệu',
                'Xã Nhật Tân',

                // Tứ Kỳ
                'Thị trấn Tứ Kỳ',
                'Xã Nguyên Giáp',
                'Xã Quang Phục',
                'Xã Minh Đức',
                'Xã Đại Sơn',
                'Xã Chí Minh',

                // Ninh Giang
                'Thị trấn Ninh Giang',
                'Xã Hồng Dụ',
                'Xã Tân Quang',
                'Xã Ứng Hoè',
                'Xã Vĩnh Hoà',
                'Xã Đông Xuyên',

                // Thanh Miện
                'Thị trấn Thanh Miện',
                'Xã Cao Thắng',
                'Xã Chi Lăng Nam',
                'Xã Thanh Tùng',
                'Xã Hồng Quang',
                'Xã Ngô Quyền'
            ]
        };



        function resetSelect(selectEl, placeholder) {
            selectEl.innerHTML = '';
            const opt = document.createElement('option');
            opt.value = '';
            opt.textContent = placeholder;
            selectEl.appendChild(opt);
        }

        function populateSelect(selectEl, items) {
            items.forEach(item => {
                const opt = document.createElement('option');
                opt.value = item;
                opt.textContent = item;
                selectEl.appendChild(opt);
            });
        }

        function loadProvinces() {
            resetSelect(provinceSelect, 'Chọn tỉnh/thành phố');
            populateSelect(provinceSelect, Object.keys(addressData));
        }

        function loadWards() {
            resetSelect(wardSelect, 'Chọn phường/xã');
            const province = provinceSelect.value;
            if (!province || !addressData[province]) {
                return;
            }
            populateSelect(wardSelect, addressData[province]);
        }

        provinceSelect.addEventListener('change', async () => {
            loadWards();

            // reset ward trước khi gọi map
            await new Promise(r => setTimeout(r, 50));

            updateLocation();
        });

        wardSelect.addEventListener('change', updateLocation);


        let map = null;
        let marker = null;

        let geocodeMessageEl = null;

        form.addEventListener('submit', (event) => {
            const province = provinceSelect.value;
            const ward = wardSelect.value;
            if (!province || !ward) {
                event.preventDefault();
                return;
            }
            if (!shippingLat.value || !shippingLng.value) {
                event.preventDefault();
                showGeocodeError('Vui lòng chọn vị trí trên bản đồ.');
                return;
            }
            shippingAddress.value = `${ward}, ${province}||${shippingLat.value},${shippingLng.value}`;
        });

        loadProvinces();

        if (mapEl && window.L) {
            const defaultLat = 10.7769;
            const defaultLng = 106.7009;
            map = L.map(mapEl).setView([defaultLat, defaultLng], 13);
            L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
                maxZoom: 19
            }).addTo(map);
            geocodeMessageEl = document.createElement('div');
            geocodeMessageEl.className = 'status-message status-error';
            geocodeMessageEl.style.display = 'none';
            mapEl.insertAdjacentElement('afterend', geocodeMessageEl);
            map.on('click', (event) => {
                const {lat, lng} = event.latlng;
                if (marker) {
                    marker.setLatLng([lat, lng]);
                } else {
                    marker = L.marker([lat, lng]).addTo(map);
                }
                shippingLat.value = lat.toFixed(6);
                shippingLng.value = lng.toFixed(6);
                if (geocodeMessageEl) {
                    geocodeMessageEl.style.display = 'none';
                    geocodeMessageEl.textContent = '';
                }
            });
        }
        async function geocodeAddress(query) {
            const url = `https://nominatim.openstreetmap.org/search?format=json&limit=1&q=${encodeURIComponent(query)}`;

            const res = await fetch(url);
            const data = await res.json();

            if (data && data.length > 0) {
                return {
                    lat: parseFloat(data[0].lat),
                    lng: parseFloat(data[0].lon)
                };
            }
            return null;
        }
        function moveMap(lat, lng) {
            if (!map) return;

            map.setView([lat, lng], 16);

            if (marker) {
                marker.setLatLng([lat, lng]);
            } else {
                marker = L.marker([lat, lng]).addTo(map);
            }

            shippingLat.value = lat.toFixed(6);
            shippingLng.value = lng.toFixed(6);
        }
        async function updateLocation() {
            const province = provinceSelect.value;
            const ward = wardSelect.value;

            if (!province || !ward) return;

            const query = `${ward}, Hải Dương, Việt Nam`;

            const result = await geocodeAddress(query);

            if (result) {
                moveMap(result.lat, result.lng);
                if (geocodeMessageEl) {
                    geocodeMessageEl.style.display = 'none';
                }
            } else {

                moveMap(20.9373, 106.3146);
                if (geocodeMessageEl) {
                    geocodeMessageEl.textContent = "Không tìm thấy chính xác, đang zoom Hải Dương";
                    geocodeMessageEl.style.display = 'block';
                }
            }
        }

    });

</script>

<div th:replace="layout/layout :: footer"></div>
</body>
</html>
