spring.application.name=demo1


# Database
spring.datasource.url=jdbc:sqlserver://localhost:1433;databaseName=ASM_Java5;encrypt=true;trustServerCertificate=true
spring.datasource.username=sa
spring.datasource.password=123
spring.datasource.driver-class-name=com.microsoft.sqlserver.jdbc.SQLServerDriver

# JPA
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.SQLServerDialect
spring.jpa.open-in-view=false

# Jackson
spring.jackson.time-zone=Asia/Ho_Chi_Minh

# Upload file
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=20MB

# Server
server.port=8080
server.tomcat.max-part-count=5000
server.tomcat.max-parameter-count=10000

# Custom config
camera.hls-url=http://10.86.42.36:8888/camera/index.m3u8

payos.client-id=${PAYOS_CLIENT_ID}
payos.api-key=${PAYOS_API_KEY}
payos.checksum-key=${PAYOS_CHECKSUM_KEY}